<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Commute360</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Shared Navigation Bar -->
    <script src="/nav.js"></script>

    <h2>Register</h2>
    <form id="registerForm">
        <label for="name">Full Name</label><br>
        <input type="text" id="name" placeholder="John Doe" required><br>

        <label for="email">Email Address</label><br>
        <input type="email" id="email" placeholder="user@example.com" required><br>

        <label for="password">Password</label><br>
        <input type="password" id="password" placeholder="Password" required><br>

        <label for="role">Register As</label><br>
        <select id="role">
            <option value="Staff">Staff</option>
            <option value="Driver">Driver</option>
        </select><br><br>

        <button type="submit">Register</button>
    </form>

    <p id="message"></p>
    <script src="/nav.js"></script>
    <script>
        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const role = document.getElementById("role").value;

            const messageEl = document.getElementById("message");
            messageEl.innerText = "Registering...";

            try {
                const res = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ name, email, password, role })
                });

                const data = await res.json();

                if (res.ok) {
                    messageEl.style.color = "green";
                    messageEl.innerText = "Registration successful! Redirecting to login...";
                    setTimeout(() => {
                        window.location.href = "/login.html";
                    }, 1500);
                } else {
                    messageEl.style.color = "red";
                    messageEl.innerText = data.error || data || "Registration failed.";
                }
            } catch (err) {
                messageEl.style.color = "red";
                messageEl.innerText = "Error connecting to server.";
            }
        });
    </script>
</body>
</html>
